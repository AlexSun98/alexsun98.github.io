{{- $h := int (default 180 .height) -}}
<svg viewBox="0 0 240 140" preserveAspectRatio="xMidYMid slice" style="width:100%;height:{{ $h }}px;display:block;background:var(--lavender)">
  <!-- prompt box -->
  <rect x="22" y="46" width="56" height="48" rx="5" fill="#fdfcf5" stroke="#151415" stroke-width="2"/>
  <text x="50" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">✎ idea</text>
  <path d="M32 76h36M32 84h24" stroke="#151415" stroke-width="2" opacity=".25" stroke-linecap="round"/>
  <!-- claude box -->
  <rect x="92" y="46" width="56" height="48" rx="5" fill="#151415" stroke="#151415" stroke-width="2"/>
  <path d="M120 56l1.8 5h5.4l-4.4 3.4 1.7 5.2-4.5-3.2-4.5 3.2 1.7-5.2-4.4-3.4h5.4z" fill="#f5dc5a"/>
  <text x="120" y="86" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#fdfcf5">claude+mcp</text>
  <!-- live box -->
  <rect x="162" y="46" width="56" height="48" rx="5" fill="#b5f26a" stroke="#151415" stroke-width="2"/>
  <text x="190" y="66" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">✓ live</text>

  <path d="M78 70h8m66 0h8" stroke="#151415" stroke-width="2"/>
  <polygon points="86,66 92,70 86,74" fill="#151415"/>
  <polygon points="156,66 162,70 156,74" fill="#151415"/>
  <!-- sparkles -->
  <path d="M36 24l2 4 4 2-4 2-2 4-2-4-4-2 4-2z" fill="#ef7065" stroke="#151415" stroke-width="1.2"/>
  <path d="M204 20l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#f5dc5a" stroke="#151415" stroke-width="1.2"/>
  <path d="M120 116q40-10 80 0" fill="none" stroke="#151415" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <text x="46" y="120" font-family="JetBrains Mono, monospace" font-size="8" opacity=".6">$ blog --publish</text>
</svg>
