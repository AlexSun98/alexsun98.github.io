{{- $h := int (default 180 .height) -}}
{{- /* Man-month as moon phases. The last phase is a machine, which is the
       change. The human underneath is the part that did not change. */ -}}
<svg viewBox="0 0 240 140" preserveAspectRatio="xMidYMid slice" style="width:100%;height:{{ $h }}px;display:block;background:var(--sky)">
  <!-- phase one, a sliver of a month -->
  <path d="M40 23a15 15 0 1 0 0 30 11 11 0 1 1 0-30z" fill="#f5dc5a" stroke="#151415" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- phase two, half lit -->
  <circle cx="88" cy="38" r="15" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
  <path d="M88 23a15 15 0 0 1 0 30z" fill="#f5dc5a"/>
  <path d="M88 23v30" stroke="#151415" stroke-width="1.6" opacity=".35"/>
  <!-- phase three, the whole month -->
  <circle cx="136" cy="38" r="15" fill="#f5dc5a" stroke="#151415" stroke-width="2.2"/>
  <circle cx="131" cy="33" r="3.4" fill="#151415" opacity=".16"/>
  <circle cx="140" cy="43" r="2.2" fill="#151415" opacity=".16"/>
  <!-- phase four, the month arrives as a machine -->
  <circle cx="184" cy="38" r="15" fill="#151415"/>
  <circle cx="184" cy="38" r="9.5" fill="none" stroke="#fdfcf5" stroke-width="1.4" stroke-dasharray="3 3" opacity=".45"/>
  <path d="M184 30l2 5.6 5.6 2-5.6 2-2 5.6-2-5.6-5.6-2 5.6-2z" fill="#f5dc5a"/>
  <!-- the change runs left to right -->
  <path d="M26 62h172" stroke="#151415" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" opacity=".55"/>
  <polygon points="198,57 206,62 198,67" fill="#151415" opacity=".55"/>
  <!-- the human, holding up the part no phase replaces -->
  <circle cx="60" cy="84" r="8.5" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
  <rect x="53" y="94" width="14" height="20" rx="6" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
  <path d="M56 114l-3 11M64 114l3 11M53 98l-9 8M67 98l14-13" stroke="#151415" stroke-width="2.2" stroke-linecap="round"/>
  <!-- the idea -->
  <circle cx="86" cy="78" r="7" fill="#f5dc5a" stroke="#151415" stroke-width="2"/>
  <rect x="83" y="84" width="6" height="4" rx="1" fill="#151415"/>
  <path d="M95 72l4-2M96 80l5 1M92 68l3-4" stroke="#151415" stroke-width="1.8" stroke-linecap="round"/>
  <!-- ground, stars -->
  <path d="M10 126c42 5 88 5 128 1 30-3 64-3 92 1" fill="none" stroke="#151415" stroke-width="2" opacity=".35" stroke-linecap="round"/>
  <circle cx="15" cy="16" r="2" fill="#fdfcf5" stroke="#151415" stroke-width="1"/>
  <path d="M216 96l1.5 3 3 1.5-3 1.5-1.5 3-1.5-3-3-1.5 3-1.5z" fill="#ef7065" stroke="#151415" stroke-width="1.2"/>
  <text x="104" y="136" font-family="JetBrains Mono, monospace" font-size="8" opacity=".6">moons change, judgment doesn't</text>
</svg>
