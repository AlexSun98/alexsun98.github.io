{{- $h := int (default 180 .height) -}}
{{- /* Homage to the tar pit on the book's cover, drawn from scratch. Brooks
       opens with great beasts thrashing in the pit. The tools above are new. */ -}}
<svg viewBox="0 0 240 140" preserveAspectRatio="xMidYMid slice" style="width:100%;height:{{ $h }}px;display:block;background:var(--peach)">
  <!-- the moon, for the month half of man-month -->
  <path d="M212 15a11 11 0 1 0 0 22 8.5 8.5 0 1 1 0-22z" fill="#f5dc5a" stroke="#151415" stroke-width="2" stroke-linejoin="round"/>
  <!-- the new tool, aimed at the old problem -->
  <rect x="18" y="14" width="36" height="26" rx="4" fill="#151415"/>
  <path d="M28 19l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#f5dc5a"/>
  <text x="43" y="31" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" font-weight="700" fill="#fdfcf5">AI</text>
  <path d="M18 21h-5M18 33h-5M54 21h5M54 33h5" stroke="#151415" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M36 44v12" stroke="#151415" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round"/>
  <polygon points="32,55 36,61 40,55" fill="#151415"/>
  <!-- the beast, drawn before the tar so the tar can swallow it -->
  <path d="M46 104c-8-12-6-30 10-36 8-4 18-6 24-2 6-12 24-16 38-8 14 8 18 28 16 46z" fill="#fdfcf5" stroke="#151415" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M46 92c-14 4-22-4-18-14 2-4 8-4 9 0-3 6 1 12 11 8z" fill="#fdfcf5" stroke="#151415" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M50 96c-12 6-24 4-32-6 2-4 6-6 9-4 6 8 15 10 24 6z" fill="#fdfcf5" stroke="#151415" stroke-width="2.2" stroke-linejoin="round"/>
  <circle cx="58" cy="78" r="2.2" fill="#151415"/>
  <path d="M84 66v10M96 62v10M108 64v10" stroke="#151415" stroke-width="2" opacity=".22" stroke-linecap="round"/>
  <!-- the tar pit -->
  <path d="M20 100c20-12 50-14 84-10 34 4 64-2 78 8 10 8 6 22-10 26-32 8-112 8-142 0-14-4-18-16-10-24z" fill="#151415"/>
  <ellipse cx="62" cy="114" rx="15" ry="4" fill="#fdfcf5" opacity=".14"/>
  <ellipse cx="150" cy="110" rx="10" ry="3" fill="#fdfcf5" opacity=".14"/>
  <!-- the man, on the bank, still doing the judging -->
  <circle cx="204" cy="70" r="7" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
  <rect x="198" y="79" width="12" height="18" rx="5" fill="#fdfcf5" stroke="#151415" stroke-width="2.2"/>
  <path d="M201 97l-3 12M207 97l3 12M198 84l-8 5M210 84l7-3" stroke="#151415" stroke-width="2.2" stroke-linecap="round"/>
  <text x="20" y="136" font-family="JetBrains Mono, monospace" font-size="8" opacity=".6">new tools, same tar pit</text>
</svg>
