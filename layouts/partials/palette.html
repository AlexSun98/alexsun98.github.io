<div id="palette" class="palette" hidden>
  <div class="palette-backdrop" data-palette-close></div>
  <div class="palette-box" role="dialog" aria-modal="true" aria-label="Command palette">
    <div class="palette-input-row">
      <span class="palette-prompt">$</span>
      <input id="palette-input" type="text" placeholder="jump to a page or post..." autocomplete="off" spellcheck="false" aria-label="Search">
    </div>
    <ul id="palette-results" class="palette-results"></ul>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>
<link rel="preload" as="fetch" href="{{ "index.json" | relURL }}" crossorigin>
