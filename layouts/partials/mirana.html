{{- /* Mirana, the site's coding agent. Soft anime portrait, flat cel style. */ -}}
{{- $size := default 180 .size -}}
<svg viewBox="0 0 140 140" width="{{ $size }}" height="{{ $size }}" style="display:block" role="img" aria-label="Mirana, Alex's coding agent">
  <defs><clipPath id="mirana-frame"><rect x="0" y="0" width="140" height="140" rx="18"/></clipPath></defs>
  <g clip-path="url(#mirana-frame)">
    <rect x="0" y="0" width="140" height="140" fill="#f6cccb"/>
    <g stroke="#6b4139" stroke-linejoin="round" stroke-linecap="round">
      <!-- hair, back mass falling past the shoulders -->
      <path d="M70 20C46 20 33 38 32 62c-1 20 1 38-3 58-1 8-1 14 0 20h82c1-6 1-12 0-20-4-20-2-38-3-58-1-24-14-42-38-42z"
            fill="#ef9f9d" stroke-width="1.7"/>
      <!-- neck -->
      <path d="M60 88h20v26H60z" fill="#f6e0cd" stroke-width="1.5"/>
      <!-- top -->
      <path d="M36 140c0-18 15-27 34-27s34 9 34 27z" fill="#fdf6ee" stroke-width="1.7"/>
      <path d="M58 114q12 10 24 0" fill="none" stroke-width="1.5"/>
      <!-- face -->
      <ellipse cx="70" cy="66" rx="27" ry="30" fill="#fdf1e6" stroke-width="1.7"/>
      <!-- fringe, side parted -->
      <path d="M43 70C43 40 54 24 70 24s27 16 27 46c-4-11-10-19-19-22-3 9-11 12-18 7-8 4-8 4-11 8z"
            fill="#ef9f9d" stroke-width="1.7"/>
      <path d="M62 32q-11 9-14 26" fill="none" stroke-width="1.1" opacity=".5"/>
      <path d="M80 31q12 9 15 25" fill="none" stroke-width="1.1" opacity=".5"/>
      <path d="M36 74q-2 22-5 40" fill="none" stroke-width="1.1" opacity=".45"/>
      <path d="M104 74q2 22 5 40" fill="none" stroke-width="1.1" opacity=".45"/>
      <!-- crescent moon clip -->
      <g transform="translate(90 48) rotate(-22)">
        <path d="M0-7A7 7 0 0 0 0 7A9.5 9.5 0 0 1 0-7Z" fill="#f2d9a6" stroke-width="1.3"/>
      </g>
      <!-- brows -->
      <path d="M53 61q6-3.5 12-0.5" fill="none" stroke-width="1.5"/>
      <path d="M75 60.5q6-3 12 0.5" fill="none" stroke-width="1.5"/>
      <!-- blush -->
      <ellipse cx="50" cy="80" rx="6" ry="3.2" fill="#f0a3a0" opacity=".55" stroke="none"/>
      <ellipse cx="90" cy="80" rx="6" ry="3.2" fill="#f0a3a0" opacity=".55" stroke="none"/>
      <!-- eyes -->
      <g style="animation:blink 4.6s step-end infinite">
        <ellipse cx="58" cy="72" rx="6" ry="7.2" fill="#7d4a3c" stroke-width="1.5"/>
        <ellipse cx="82" cy="72" rx="6" ry="7.2" fill="#7d4a3c" stroke-width="1.5"/>
        <circle cx="60.2" cy="69" r="2.2" fill="#fff" stroke="none"/>
        <circle cx="84.2" cy="69" r="2.2" fill="#fff" stroke="none"/>
        <circle cx="56.4" cy="75" r="1.1" fill="#fff" opacity=".8" stroke="none"/>
        <circle cx="80.4" cy="75" r="1.1" fill="#fff" opacity=".8" stroke="none"/>
        <path d="M51.5 66.5q6.5-4 13 0" fill="none" stroke-width="2.2"/>
        <path d="M75.5 66.5q6.5-4 13 0" fill="none" stroke-width="2.2"/>
      </g>
      <!-- nose + mouth -->
      <path d="M70 78v2" fill="none" stroke-width="1.2"/>
      <path d="M66 85q4 5 8 0z" fill="#c76a63" stroke-width="1.4"/>
    </g>
  </g>
</svg>
